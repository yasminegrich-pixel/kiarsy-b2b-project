<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="logo_emblem.png" alt="Kiarsy" class="brand-logo" />
      <div>
        <h1>Kiarsy</h1>
        <p>Cultural Affinity Engine</p>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/dna" routerLinkActive="active">Company DNA</a>
      <a routerLink="/matches" routerLinkActive="active">Symbol Matches</a>
      <a routerLink="/extrait" routerLinkActive="active">Client Extrait</a>
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/profile" routerLinkActive="active">My profile</a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-line" *ngIf="api.isLoggedIn()">
        Signed in as <strong>{{ username }}</strong>
      </div>

      <button
        type="button"
        class="logout-btn"
        *ngIf="api.isLoggedIn()"
        (click)="logout()"
      >
        Log out
      </button>

      <div class="status-line">
        <span class="status-dot"></span>
        Secure worker access
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
