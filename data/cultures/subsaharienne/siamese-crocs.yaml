id: siamese-crocs
name: "Funtumfunefu Denkyemfunefu — Siamese Crocodiles"
culture: subsaharienne
meaning: >
  "Siamese crocodiles share one stomach, yet they fight over food."
  A powerful symbol of unity in diversity and the harm of tribalism/infighting.
  It teaches that we share a common destiny.
values:
  - "Diversity, Inclusion & Minority Rights"
  - "Collaboration, Partnerships & Ecosystems"
  - "Justice, Human Rights & Transparency"
sources:
  - "Kiarsy Subsaharienne Database (Funtumfunefu Denkyemfunefu)"
design_notes: "Diversity, equity, and inclusion (DEI) programs."
popularity: high
usage: open
