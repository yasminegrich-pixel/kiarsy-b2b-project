id: gye-wani
name: "Gye W'ani (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Gye W'ani ("Amuse yourself") represents joy, celebration, and living fully.
values:
  - "Care, Health & Community Nurturing"
  - "Economic Growth & Abundance"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Joy and celebration motif."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
