id: akoma
name: "Akoma — The Heart"
culture: subsaharienne
meaning: >
  Symbol of patience, tolerance, endurance, and understanding.
  "To have a heart in the belly" is to be extremely tolerant. It represents
  the ability to endure frustration and maintain goodwill.
values:
  - "Care, Health & Community Nurturing"
  - "Collaboration, Partnerships & Ecosystems"
sources:
  - "Kiarsy Subsaharienne Database (Akoma)"
design_notes: "Long-term impact and patient capital."
popularity: high
usage: open
