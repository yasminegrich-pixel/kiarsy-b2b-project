id: aban
name: "Aban — The Fortress"
culture: subsaharienne
meaning: >
  A symbol of strength, authority, and magnificence. In times of
  conflict, the fortress was a haven of peace and protection. It
  embodies safety, security, and the power to protect one's community.
values:
