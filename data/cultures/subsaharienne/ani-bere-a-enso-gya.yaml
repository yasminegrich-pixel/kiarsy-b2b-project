id: ani-bere-a-enso-gya
name: "Ani Bere A Enso Gya (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Ani Bere A Enso Gya ("Angry eyes that don't ignite") represents patience, self-control, and self-discipline.
values:
  - "Trust, Security & Risk Management"
  - "Leadership, Governance & Authority"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Patience and self-control motif."
popularity: low
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
