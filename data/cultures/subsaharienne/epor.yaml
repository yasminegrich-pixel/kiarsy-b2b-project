id: epor
name: "Epor (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Epor represents resistance against oppression and the determination to overcome adversity.
values:
  - "Justice, Human Rights & Transparency"
  - "Resilience, Endurance & Crisis Survival"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Resistance and determination motif."
popularity: low
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
