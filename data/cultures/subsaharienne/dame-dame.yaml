id: dame-dame
name: "Dame-Dame (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Dame-Dame ("Chequered / draftboard") represents intelligence, strategy, and the complexity of life’s choices.
values:
  - "Leadership, Governance & Authority"
  - "Entrepreneurship & Innovation"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Strategy and intelligence motif."
popularity: low
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
