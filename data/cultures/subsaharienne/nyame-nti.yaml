id: nyame-nti
name: "Nyame Nti (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Nyame Nti ("By God's grace") represents faith, trust in divine providence, and dependence on a higher power for sustenance.
values:
  - "Trust, Security & Risk Management"
  - "Care, Health & Community Nurturing"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Divine providence and sustenance."
popularity: high
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
