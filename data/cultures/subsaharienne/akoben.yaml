id: akoben
name: "Akoben — The War Horn"
culture: subsaharienne
meaning: >
  The war horn, a symbol of vigilance, prudence, and readiness.
  It represents the call to action and the constant awareness
  required to maintain safety and protect the community.
values:
  - "Trust, Security & Risk Management"
  - "Resilience, Endurance & Crisis Survival"
sources:
  - "Kiarsy Subsaharienne Database (Akoben)"
design_notes: "Vigilance and HSE (Health, Safety, Environment) motif."
popularity: medium
usage: open
