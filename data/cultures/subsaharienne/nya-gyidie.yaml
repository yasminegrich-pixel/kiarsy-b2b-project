id: nya-gyidie
name: "Nya Gyidie (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Nya Gyidie ("Have faith / confidence") represents faith, confidence, and trust.
values:
  - "Trust, Security & Risk Management"
  - "Leadership, Governance & Authority"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Faith and confidence motif."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
