id: nyame-biribi-wo-soro
name: "Nyame Biribi Wo Soro (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Nyame Biribi Wo Soro ("God is in the heavens") represents hope, faith, and the belief that divine support exists.
values:
