id: wo-nsa-da-mu-a
name: "Wo Nsa Da Mu A (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Wo Nsa Da Mu A ("If your hands are in the dish") represents participatory democracy, shared responsibility, and collective decision-making.
values:
  - "Collaboration, Partnerships & Ecosystems"
  - "Leadership, Governance & Authority"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Strong for shared governance and participation."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
