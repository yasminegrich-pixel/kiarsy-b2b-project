id: bi-nka-bi
name: "Bi Nka Bi (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Bi Nka Bi ("No one should bite another") represents peace, justice, fair play, harmony, and the avoidance of conflict.
values:
  - "Justice, Human Rights & Transparency"
  - "Collaboration, Partnerships & Ecosystems"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Strong for justice, fairness and peaceful coexistence."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
