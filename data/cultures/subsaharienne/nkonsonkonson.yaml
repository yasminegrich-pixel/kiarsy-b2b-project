id: nkonsonkonson
name: "Nkonsonkonson (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Nkonsonkonson ("Chain links") represents unity, community, and the strength that comes from interdependence.
values:
  - "Collaboration, Partnerships & Ecosystems"
  - "Care, Health & Community Nurturing"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Unity through interdependence."
popularity: high
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
