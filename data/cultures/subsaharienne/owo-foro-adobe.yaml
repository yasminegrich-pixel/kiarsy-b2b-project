id: owo-foro-adobe
name: "Owo Foro Adobe (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Owo Foro Adobe ("Snake climbing the raffia tree") represents determination, perseverance, and performing the unusual or difficult to achieve a goal.
values:
  - "Resilience, Endurance & Crisis Survival"
  - "Entrepreneurship & Innovation"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Determination and unusual achievement."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
