id: nyansapo
name: "Nyansapo — The Wisdom Knot"
culture: subsaharienne
meaning: >
  "A wise person has the capacity to choose the best means to attain a goal."
  Symbol of wisdom, ingenuity, intelligence, and patience. It implies that
  having wisdom includes knowing how to apply it.
values:
  - "Leadership, Governance & Authority"
  - "Entrepreneurship & Innovation"
sources:
  - "Kiarsy Subsaharienne Database (Nyansapo)"
design_notes: "Strategic leadership and advisory boards."
popularity: high
usage: open
