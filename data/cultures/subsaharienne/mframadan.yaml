id: mframadan
name: "Mframadan (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Mframadan ("Wind-resistant house") represents resilience, fortitude, and the ability to withstand the storms of life.
values:
  - "Resilience, Endurance & Crisis Survival"
  - "Trust, Security & Risk Management"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Strong resilience and stability motif."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
