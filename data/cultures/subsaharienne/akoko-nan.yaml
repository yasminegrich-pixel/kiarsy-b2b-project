id: akoko-nan
name: "Akoko Nan — The Hen's Foot"
culture: subsaharienne
meaning: >
  "The hen treads on her chicks, but she does not kill them."
  Represents the ideal nature of parenthood: protective and corrective,
  but not destructive. A symbol of nurturing, discipline, and care.
values:
  - "Care, Health & Community Nurturing"
  - "Youth Development & Next-Gen Education"
sources:
  - "Kiarsy Subsaharienne Database (Akoko Nan)"
design_notes: "Mentorship and incubator programs."
popularity: high
usage: open
