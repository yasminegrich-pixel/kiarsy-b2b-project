id: abe-dua
name: "Abe Dua (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Abe Dua ("The palm tree") represents wealth, resourcefulness, and self-sufficiency.
values:
  - "Economic Growth & Abundance"
  - "Resilience, Endurance & Crisis Survival"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Palm tree; good for abundance and self-reliance narratives."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
