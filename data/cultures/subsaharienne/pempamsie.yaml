id: pempamsie
name: "Pempamsie (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Pempamsie ("Be linked like chain links") represents unity as strength, and the importance of preparedness.
values:
  - "Collaboration, Partnerships & Ecosystems"
  - "Resilience, Endurance & Crisis Survival"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Chain-link unity and readiness motif."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
