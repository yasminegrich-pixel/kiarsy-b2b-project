id: bese-saka
name: "Bese Saka (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Bese Saka ("Sack of cola nuts") represents affluence, power, abundance, and togetherness.
values:
  - "Economic Growth & Abundance"
  - "Collaboration, Partnerships & Ecosystems"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Cola nut sack; abundance and togetherness."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
