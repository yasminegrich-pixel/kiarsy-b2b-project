id: asase-ye-duru
name: "Asase Ye Duru — The Earth Has Weight"
culture: subsaharienne
meaning: >
  Symbol of the providence and divinity of Mother Earth. Represents the
  importance of the earth in maintaining life and the need to treat it
  with respect and reverence.
values:
  - "Environmental Sustainability & Climate Action"
  - "Care, Health & Community Nurturing"
sources:
  - "Kiarsy Subsaharienne Database (Asase Ye Duru)"
design_notes: "Environmental and agritech focus."
popularity: medium
usage: open
