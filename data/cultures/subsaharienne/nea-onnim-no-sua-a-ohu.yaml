id: nea-onnim-no-sua-a-ohu
name: "Nea Onnim No Sua A Ohu (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Nea Onnim No Sua A Ohu ("He who does not know can know through learning") represents knowledge, lifelong learning, and the pursuit of education.
values:
  - "Youth Development & Next-Gen Education"
  - "Transformation, Renewal & Change Management"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Strong education and continuous learning motif."
popularity: high
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
