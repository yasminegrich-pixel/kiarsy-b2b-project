id: okodee-mmowere
name: "Okodee Mmowere (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Okodee Mmowere ("The talons of the eagle") represents strength, bravery, power, and the ability to protect what is valued.
values:
  - "Leadership, Governance & Authority"
  - "Resilience, Endurance & Crisis Survival"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Strength and protective power."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
