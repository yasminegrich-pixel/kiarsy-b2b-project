id: ananse-ntontan
name: "Ananse Ntontan — The Spider's Web"
culture: subsaharienne
meaning: >
  Symbol of wisdom, creativity, and the complexity of life. Ananse the
  spider is the storyteller and messenger; the web represents the
  intricate network of life and the ability to weave resources together.
