id: aya
name: "Aya — The Fern"
culture: subsaharienne
meaning: >
  Symbol of endurance, resourcefulness, and defiance against difficulties.
  The fern is a hardy plant that can grow in difficult places; a person
  wearing this symbol suggests they have survived many hardships.
values:
  - "Resilience, Endurance & Crisis Survival"
sources:
  - "Kiarsy Subsaharienne Database (Aya)"
design_notes: "Resilience and pivoting in tough markets."
popularity: high
usage: open
