id: fihankra
name: "Fihankra (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Fihankra ("Compound house / enclosed courtyard") represents security, safety, and the completeness of a community living together.
values:
  - "Care, Health & Community Nurturing"
  - "Trust, Security & Risk Management"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Community security and togetherness."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
