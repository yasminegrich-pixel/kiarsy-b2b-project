id: dwennimmen
name: "Dwennimmen (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Dwennimmen ("Ram's horns") represents humility together with strength, and the wisdom of knowing when to be forceful and when to be gentle.
values:
  - "Leadership, Governance & Authority"
  - "Resilience, Endurance & Crisis Survival"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Strength tempered by humility."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
