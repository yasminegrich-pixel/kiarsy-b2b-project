id: fawohodie
name: "Fawohodie (Adinkra symbol)"
culture: subsaharienne
meaning: >
  Fawohodie ("Independence") represents freedom and emancipation, with the understanding that independence comes with responsibility.
values:
  - "Diversity, Inclusion & Minority Rights"
  - "Justice, Human Rights & Transparency"
sources:
  - "adinkrasymbols.org"
  - "User-supplied Adinkra research workbook"
design_notes: "Independence and responsibility motif."
popularity: medium
usage: open
usage_note: "Widely used in contemporary Ghanaian commercial and civic life; avoid presenting it as representing all of sub-Saharan Africa."
