id: kokopelli
name: "Kokopelli — The Flute Player"
culture: amerindienne
meaning: >
  A humpbacked flute player; symbolizes fertility, joy, music, and the
  arrival of spring. Historically also a traveling trader who carried
  goods and stories between tribes.
values:
  - "Economic Growth & Abundance"
  - "Transformation, Renewal & Change Management"
sources:
  - "Kiarsy Amérindienne Database (Kokopelli)"
design_notes: "Storytelling: The original traveling founder/trader."
popularity: high
usage: restricted
usage_note: "Sacred deity to Hopi, Zuni and other Pueblo tribes. Commercial use is highly controversial and often considered appropriation. Requires tribal partnership/expert validation."
