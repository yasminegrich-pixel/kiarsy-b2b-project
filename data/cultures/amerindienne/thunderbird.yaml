id: thunderbird
name: "The Thunderbird"
culture: amerindienne
meaning: >
  A supernatural bird of immense power; creates thunder with its wings
  and lightning from its eyes. Symbolizes courage, wisdom, unlimited
  strength, and protection from evil spirits.
