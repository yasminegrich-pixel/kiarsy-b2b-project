id: crossed-arrows
name: "Crossed arrows"
culture: amerindienne
meaning: >
  Crossed arrows represent unity, peace, and the strength of nations standing together (Haudenosaunee Confederacy symbolism).
values:
  - "Collaboration, Partnerships & Ecosystems"
  - "Justice, Human Rights & Transparency"
sources:
  - "https://www.haudenosauneeconfederacy.com/symbols/"
design_notes: "Unity and peace between nations."
popularity: medium
usage: open
usage_note: "Do not label every crossed-arrow design as Haudenosaunee. Distinguish the Confederacy emblem from generic commercial crossed arrows."
