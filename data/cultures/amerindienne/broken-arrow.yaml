id: broken-arrow
name: "The Broken Arrow"
culture: amerindienne
meaning: >
  While a single arrow means direction and protection, a broken arrow
  universally symbolizes peace, the end of conflict, and the forging
  of a pact or union between different groups.
values:
  - "Collaboration, Partnerships & Ecosystems"
sources:
