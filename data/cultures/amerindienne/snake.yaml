id: snake
name: "The Snake (Rattlesnake)"
culture: amerindienne
meaning: >
  Unlike Western symbolism, the snake (especially the rattlesnake) is
  revered as a symbol of healing, wisdom, rain-bringing, and the power
  of nature. It represents speed, defiance, and protection.
