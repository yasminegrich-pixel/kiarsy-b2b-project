  - "Environmental Sustainability & Climate Action"
sources:
  - "Haudenosaunee and Anishinaabe creation traditions"
  - "Oneida Nation and related community sources"
design_notes: "Land, creation, and continuity concept."
popularity: high
usage: open
usage_note: "Do not present Turtle Island as a single belief shared identically by every Indigenous nation."
