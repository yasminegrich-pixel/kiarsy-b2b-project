id: zia-sun
name: "Zia Sun"
culture: amerindienne
meaning: >
  The Zia Sun represents the four directions, four times of day, four seasons, and four stages of life. It is a sacred symbol of Zia Pueblo.
values:
  - "Heritage, Craftsmanship & Legacy"
  - "Transformation, Renewal & Change Management"
sources:
  - "https://indianpueblo.org/revisiting-ours-the-zia-sun/"
design_notes: "Sacred fourfold solar symbol."
popularity: high
usage: restricted
usage_note: "Sacred Pueblo symbol. Avoid treating it as generic Southwestern decoration or reproducing it without understanding Zia Pueblo context."
