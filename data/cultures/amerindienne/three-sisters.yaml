id: three-sisters
name: "The Three Sisters (corn–bean–squash)"
culture: amerindienne
meaning: >
  Indigenous companion-planting system where three crops nurture each
  other like family — corn supports, beans enrich the soil, squash protects;
  a teaching about cooperation and sustainable abundance.
values:
  - "Collaboration, Partnerships & Ecosystems"
  - "Environmental Sustainability & Climate Action"
sources:
  - "https://www.nal.usda.gov/collections/stories/three-sisters"
design_notes: "Three-part modular structure for ecosystem awards."
popularity: medium
