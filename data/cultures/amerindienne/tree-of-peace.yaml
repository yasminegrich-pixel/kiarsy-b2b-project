id: tree-of-peace
name: "Tree of Peace / White Pine"
culture: amerindienne
meaning: >
  The Tree of Peace represents peace, unity, protection, and the union of the Haudenosaunee nations.
values:
  - "Collaboration, Partnerships & Ecosystems"
  - "Justice, Human Rights & Transparency"
sources:
  - "https://www.haudenosauneeconfederacy.com/symbols/"
  - "Oneida Nation symbolism"
design_notes: "Central Haudenosaunee emblem of peace and unity."
popularity: high
usage: open
usage_note: "Use the Haudenosaunee term and context rather than reducing the tree to a generic peace symbol."
