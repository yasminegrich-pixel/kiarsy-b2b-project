id: tattoo-protection
name: "Protective tattoo practice"
culture: amazigh
meaning: >
  Protective tattoos represent protection from the evil eye and harmful influences in historic Maghrebi and Amazigh body-marking practices.
values:
  - "Trust, Security & Risk Management"
  - "Heritage, Craftsmanship & Legacy"
sources:
  - "Encyclopédie berbère – Mauvais œil / amulettes et talismans"
design_notes: "Apotropaic body marking."
popularity: medium
usage: restricted
usage_note: "Do not assume all historical facial tattoos were protective or reproduce sacred/personal marks as generic decoration."
