id: yaz
name: "Yaz (ⵣ) — The Free Man"
culture: amazigh
meaning: >
  Tifinagh letter "yaz," meaning "free man" — the very meaning of the
  word Amazigh; a symbol of identity, freedom, dignity and pride; per
  expert Mongi Bouras (Tamezret museum) it also marks the person stably
  identified with the earth.
values:
  - "Diversity, Inclusion & Minority Rights"
  - "Justice, Human Rights & Transparency"
sources:
