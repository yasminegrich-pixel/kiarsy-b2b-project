  - "Kiarsy Amazigh Master Database v2 (AMZ-SYM-009)"
design_notes: "Bold central glyph; hero mark for flagship gifts."
popularity: high
usage: open
usage_note: "Identity symbol with political charge — define conditions for commercial use."
