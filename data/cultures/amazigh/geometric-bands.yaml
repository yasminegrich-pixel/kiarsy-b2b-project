id: geometric-bands
name: "Geometric linear bands"
culture: amazigh
meaning: >
  Geometric linear bands represent regional identity and symbolic expression in Amazigh and Maghrebi rural pottery and textile traditions.
values:
  - "Heritage, Craftsmanship & Legacy"
  - "Diversity, Inclusion & Minority Rights"
sources:
