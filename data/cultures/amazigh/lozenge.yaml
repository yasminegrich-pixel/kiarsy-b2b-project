id: lozenge
name: "The Concentric Lozenge / Diamond"
culture: amazigh
meaning: >
  The diamond is the core Amazigh symbol of the female principle, fertility
  and protection; the concentric form with a center dot reads as the
  protected heart of the home. Associated with the serpent, it represents
  the union of opposites.
values:
  - "Women's Empowerment & Gender Equity"
  - "Care, Health & Community Nurturing"
sources:
