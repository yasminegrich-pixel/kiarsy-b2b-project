id: lozenge
name: "The Concentric Lozenge / Diamond"
culture: amazigh
meaning: >
  The diamond is the core Amazigh symbol of the female principle, fertility
  and protection; the concentric form with a center dot reads as the
  protected heart of the home, the watchful center.
values:
  - "women's empowerment"
  - "youth development"
sources:
  - "https://siloom.com/what-do-the-symbols-on-a-berber-rug-mean/"
design_notes: "Diamond-in-diamond emboss as hero geometric mark."
popularity: high
