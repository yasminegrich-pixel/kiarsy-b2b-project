id: afus
name: "Afus — The Hand"
culture: amazigh
meaning: >
  In Amazigh pattern language the hand "creates and protects" — it guards
  the family and home; its five fingers stand for strength, power and
  blessing. Tattooed by women to ward off the evil eye and give courage
  in periods of change; closely linked to the khamsa.
values:
  - "Women's Empowerment & Gender Equity"
  - "Trust, Security & Risk Management"
sources:
  - "https://carpetparadis.store/pages/berber-amazigh-symbols-meaning"
  - "Kiarsy Amazigh Master Database v2 (AMZ-SYM-006)"
design_notes: "Open-hand glyph for maker-style gifts."
popularity: high
usage: restricted
usage_note: "Protective/spiritual charge — validate commercial scope with an expert."
