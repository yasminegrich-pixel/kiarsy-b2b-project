id: cruciform-pendant
name: "Cruciform / Southern Cross pendant"
culture: amazigh
meaning: >
  The cruciform pendant represents guidance and protection for travelers; its form evokes the four cardinal directions and, among the Tuareg, a father’s blessing for a safe journey.
values:
  - "Trust, Security & Risk Management"
  - "Resilience, Endurance & Crisis Survival"
sources:
  - "The Metropolitan Museum of Art – Necklace"
design_notes: "Traveler’s protection and directional symbolism."
popularity: medium
usage: open
usage_note: "Avoid assigning one meaning to every cross motif in Amazigh art. Form, region, and object type matter. Not automatically a Christian symbol."
