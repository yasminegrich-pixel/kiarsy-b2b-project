id: coral
name: "Coral"
culture: amazigh
meaning: >
  Coral represents blessing, protection, and fertility, especially in women’s jewelry of Moroccan and Kabyle traditions.
values:
  - "Care, Health & Community Nurturing"
  - "Heritage, Craftsmanship & Legacy"
sources:
  - "The Metropolitan Museum of Art collections (Morocco & Algeria)"
design_notes: "Material with protective and blessing associations."
popularity: medium
usage: open
usage_note: "Treat coral’s meanings as historically documented beliefs in particular jewelry traditions, not as a universal rule for all Amazigh communities."
