id: kabyle-triangle
name: "Triangle motif in Kabyle pottery"
culture: amazigh
meaning: >
  The triangle motif in Kabyle pottery is associated with femininity and fertility (sometimes read as the womb), as well as protection.
values:
  - "Care, Health & Community Nurturing"
  - "Women's Empowerment & Gender Equity"
sources:
  - "The Metropolitan Museum of Art – Kabyle Platter"
design_notes: "Feminine and protective geometry."
popularity: medium
usage: open
usage_note: "Do not assign a single gender, mountain, tent, or fertility meaning to every triangle without a local source."
