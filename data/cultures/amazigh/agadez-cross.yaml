id: agadez-cross
name: "The Amazigh Cross / Cross of Agadez (Talakakait)"
culture: amazigh
meaning: >
  Traditionally given by a father to his son when he comes of age or leaves
  home to travel: "My son, I give you the four corners of the world."
  The shape represents the compass, the four cardinal directions, and
  protection during long journeys.
values:
