name: "The Wheat Ear / Seed over the Triangle"
culture: amazigh
meaning: >
  Motifs read as seed, sown field and harvest — fertility of the earth,
  abundance and growth. Wheat is ambivalent: life in the flowering ear,
  death in the buried seed — a full cycle of renewal.
