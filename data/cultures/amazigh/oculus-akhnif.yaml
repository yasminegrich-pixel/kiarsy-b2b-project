id: oculus-akhnif
name: "Oculus motif on akhnif"
culture: amazigh
meaning: >
  The oculus motif on the akhnif (woven cloak) represents protection from the evil eye and misfortune (Ait Ouaouzguite / Wawzgit tradition).
values:
  - "Trust, Security & Risk Management"
  - "Heritage, Craftsmanship & Legacy"
sources:
  - "The Metropolitan Museum of Art – Akhnif / Burnus"
design_notes: "Large protective eye motif on men’s woven cloak."
popularity: medium
usage: open
usage_note: "Keep this interpretation tied to the akhnif tradition. Do not label every circle or eye-like motif as the same symbol."
