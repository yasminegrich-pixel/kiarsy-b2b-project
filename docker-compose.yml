services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-kiarsy_affinity}
      POSTGRES_USER: ${DB_USER:-kiarsy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kiarsy_secret}
    ports:
      - "5433:5432"
    volumes:
      - kiarsy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kiarsy} -d ${DB_NAME:-kiarsy_affinity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kiarsy_affinity}
      DB_USER: ${DB_USER:-kiarsy}
      DB_PASSWORD: ${DB_PASSWORD:-kiarsy_secret}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  kiarsy_pgdata:
